<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="catBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5f7" />
      <stop offset="100%" stop-color="#ffe3eb" />
    </radialGradient>
    <linearGradient id="fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf7" />
      <stop offset="50%" stop-color="#f5e6d3" />
      <stop offset="100%" stop-color="#e0caa8" />
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff1a40" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#8a2340" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background aura -->
  <circle cx="160" cy="160" r="145" fill="url(#catBg)" filter="url(#shadow)" />
  <circle cx="160" cy="160" r="142" fill="none" stroke="#ffb6c1" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Kitty Body & Paws -->
  <g transform="translate(0, 10)">
    <!-- Cat Ears -->
    <polygon points="105,100 85,55 130,75" fill="#f5e6d3" />
    <polygon points="102,96 90,65 124,78" fill="#ffb8cc" />
    <polygon points="215,100 235,55 190,75" fill="#f5e6d3" />
    <polygon points="218,96 230,65 196,78" fill="#ffb8cc" />

    <!-- Cat Head -->
    <ellipse cx="160" cy="125" rx="68" ry="58" fill="url(#fur)" filter="url(#shadow)" />

    <!-- Pink Heart Sunglasses -->
    <!-- Left Heart Lens -->
    <path d="M125 108 C125 98, 108 92, 100 102 C92 92, 75 98, 75 108 C75 125, 100 138, 100 138 C100 138, 125 125, 125 108 Z" fill="#ff1a60" stroke="#fff" stroke-width="2.5" />
    <path d="M85 102 C82 105, 82 110, 85 113" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Bridge -->
    <path d="M125 112 Q140 106 155 112" stroke="#ff1a60" stroke-width="4" fill="none" />

    <!-- Right Heart Lens -->
    <path d="M205 108 C205 98, 188 92, 180 102 C172 92, 155 98, 155 108 C155 125, 180 138, 180 138 C180 138, 205 125, 205 108 Z" fill="#ff1a60" stroke="#fff" stroke-width="2.5" />
    <path d="M165 102 C162 105, 162 110, 165 113" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Nose & Mouth -->
    <polygon points="156,146 164,146 160,152" fill="#ff758c" />
    <path d="M152 153 Q160 159 160 152 Q160 159 168 153" fill="none" stroke="#a06040" stroke-width="2" stroke-linecap="round" />

    <!-- Whiskers -->
    <line x1="75" y1="140" x2="45" y2="135" stroke="#a06040" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="72" y1="148" x2="40" y2="148" stroke="#a06040" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="245" y1="140" x2="275" y2="135" stroke="#a06040" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="248" y1="148" x2="280" y2="148" stroke="#a06040" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

    <!-- Cat Body -->
    <path d="M115 170 Q95 210 110 260 L210 260 Q225 210 205 170 Z" fill="url(#fur)" />

    <!-- Bouquet of Flowers in Left Paw -->
    <g transform="translate(75, 175) rotate(-15)">
      <!-- Bouquet Wrap -->
      <polygon points="25,50 5,100 45,100" fill="#edd6b8" stroke="#c49b6b" stroke-width="1.5" />
      <circle cx="15" cy="40" r="14" fill="url(#rose)" />
      <circle cx="35" cy="40" r="14" fill="url(#rose)" />
      <circle cx="25" cy="25" r="16" fill="url(#rose)" />
      <circle cx="25" cy="25" r="7" fill="#ffb8cc" opacity="0.6" />
      <circle cx="15" cy="40" r="6" fill="#ffb8cc" opacity="0.6" />
      <circle cx="35" cy="40" r="6" fill="#ffb8cc" opacity="0.6" />
      <!-- Leaves -->
      <path d="M5 30 Q-5 20 5 15 Q15 25 5 30 Z" fill="#69a463" />
      <path d="M45 30 Q55 20 45 15 Q35 25 45 30 Z" fill="#69a463" />
      <text x="25" y="85" text-anchor="middle" font-size="12" fill="#8b3a4a">For You</text>
    </g>

    <!-- Gift Box in Right Paw -->
    <g transform="translate(195, 205)">
      <rect x="0" y="10" width="46" height="42" rx="4" fill="#ff4070" filter="url(#shadow)" />
      <rect x="-3" y="4" width="52" height="12" rx="3" fill="#ff2658" />
      <!-- Golden Ribbons -->
      <rect x="18" y="4" width="10" height="48" fill="#ffd700" />
      <rect x="-3" y="24" width="52" height="8" fill="#ffd700" />
      <!-- Bow -->
      <path d="M18 4 C10 -6, 2 6, 20 4 C38 6, 30 -6, 22 4 Z" fill="#ffd700" />
    </g>

    <!-- Cute Paws holding items -->
    <circle cx="120" cy="205" r="14" fill="#ffffff" stroke="#e0caa8" stroke-width="2" />
    <circle cx="200" cy="205" r="14" fill="#ffffff" stroke="#e0caa8" stroke-width="2" />
  </g>

  <!-- Sparkles around -->
  <text x="50" y="70" font-size="24">✨</text>
  <text x="260" y="80" font-size="24">💖</text>
  <text x="40" y="270" font-size="22">🌸</text>
  <text x="260" y="260" font-size="22">✨</text>
</svg>
